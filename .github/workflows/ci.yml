name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token can read the repository and nothing else. A workflow that runs
# `pytest` does not need to write to it.
permissions:
  contents: read

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Pinned to commit SHAs rather than to tags. A tag is a pointer the
      # action's publisher can move, and a workflow that follows it runs
      # whatever the tag points at next, with no change visible here. The
      # release each SHA corresponds to is beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      # The gate protects the MEASUREMENT rather than a product. It fails when
      # erasure regresses AND when everything suddenly passes. Perfect
      # detector recall or weak strategies that stop leaking both mean the
      # corpus has been fitted to its own answers and can no longer tell a
      # thorough erasure from a careless one.
      - name: Boundary gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m boundary.gate

      # The demo is the offline end-to-end path. Running it in CI keeps
      # SAMPLE_RUN.md honest: if the demo breaks, the build breaks.
      - name: Demo (offline mock)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py
